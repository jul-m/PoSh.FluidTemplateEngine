name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/PoSh.FluidTemplateEngine.csproj

      - name: Package module
        shell: pwsh
        run: ./run.ps1 -Mode Package -BuildConfig Release

      - name: Run full test suite
        shell: pwsh
        run: |
          # package module so tests execute against the same build that will be released
          ./run.ps1 -Mode Tests

      - name: Upload module artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: PoSh.FluidTemplateEngine-module
          path: out/publish/PoSh.FluidTemplateEngine/
          retention-days: 30
