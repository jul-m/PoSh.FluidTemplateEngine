name: Release

run-name: >-
  ${{ inputs.prerelease-name != '' && format('Prerelease {0}', inputs.prerelease-name) || 'Release' }}
  #${{ github.run_number }}${{ inputs.publish-psgallery && ' and publish PSGallery' || '' }}

on:
  workflow_dispatch:
    inputs:
      prerelease-name:
        description: 'Optional suffix for prerelease (e.g. "beta"). Leave empty for a full release.'
        required: false
        default: ''
      publish-psgallery:
        description: 'Publish the resulting module to PowerShell Gallery?'
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build Module
    runs-on: ubuntu-latest
    environment: release
    outputs:
      release-tag: ${{ steps.compute-tag.outputs.release-tag }}
      prerelease: ${{ steps.compute-tag.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute release tag and update version files
        id: compute-tag
        env:
          PRERELEASE_NAME: ${{ github.event.inputs.prerelease-name }}
        run: |  # shell
          set -e
          csproj=src/PoSh.FluidTemplateEngine.csproj
          psd1=PoSh.FluidTemplateEngine.psd1

          # major.minor follow the Fluid.Core package reference; patch counts existing stable tags from 0
          base=$(grep -oP '<PackageReference Include="Fluid\.Core" Version="\K[0-9]+\.[0-9]+' "$csproj")
          if [ -z "$base" ]; then
            echo "Could not determine Fluid.Core version from csproj" >&2
            exit 1
          fi
          patch=0
          while read -r t; do
            if [[ "$t" =~ ^${base//./\\.}\.([0-9]+)$ ]] && (( BASH_REMATCH[1] >= patch )); then
              patch=$((BASH_REMATCH[1] + 1))
            fi
          done < <(git tag --list "${base}.*")
          version="${base}.${patch}"

          if [ -n "$PRERELEASE_NAME" ]; then
            tag="${version}-${PRERELEASE_NAME}"
            prerelease=true
          else
            tag="$version"
            prerelease=false
            # full releases only from main branch
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "Full release can only be run on the main branch (current ref: $GITHUB_REF)" >&2
              exit 1
            fi
          fi
          echo "Computed release tag: $tag"
          echo "release-tag=$tag" >> $GITHUB_OUTPUT
          echo "prerelease=$prerelease" >> $GITHUB_OUTPUT

          # sync version in csproj and module manifest, then commit before tagging
          sed -i -E "s|<Version>[^<]+</Version>|<Version>${version}</Version>|" "$csproj"
          sed -i -E "s|(ModuleVersion = )'[^']*'|\1'${version}'|; s|(Prerelease = )'[^']*'|\1'${PRERELEASE_NAME}'|" "$psd1"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- "$csproj" "$psd1"; then
            git add "$csproj" "$psd1"
            git commit -m "chore(release): set version to ${tag} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          git tag "$tag"
          git push origin "$tag"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/PoSh.FluidTemplateEngine.csproj

      - name: Build & Package
        shell: pwsh
        run: ./run.ps1 -Mode Package -BuildConfig Release

      - name: Run full test suite
        shell: pwsh
        run: |
          # execute the Pester tests against the freshly built package
          ./run.ps1 -Mode Tests

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: module-package
          path: out/publish/PoSh.FluidTemplateEngine/

      - name: Publish to PSGallery
        if: ${{ github.event.inputs.publish-psgallery == 'true' }}
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |  # powershell
          if (-not $env:NUGET_API_KEY) {
            throw 'PSGALLERY_API_KEY secret is not set'
          }
          Publish-Module -Path './out/publish/PoSh.FluidTemplateEngine' -NuGetApiKey $env:NUGET_API_KEY -Verbose

      - name: Create release archive
        run: |  # shell
          cd out/publish/PoSh.FluidTemplateEngine
          zip -r ../../../PoSh.FluidTemplateEngine-${{ steps.compute-tag.outputs.release-tag }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.compute-tag.outputs.release-tag }}
          generate_release_notes: true
          files: ${{ github.workspace }}/PoSh.FluidTemplateEngine-${{ steps.compute-tag.outputs.release-tag }}.zip
          draft: false
          prerelease: ${{ steps.compute-tag.outputs.prerelease }}
