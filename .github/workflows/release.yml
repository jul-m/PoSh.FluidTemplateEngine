name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease-name:
        description: 'Optional suffix for prerelease (e.g. "beta"). Leave empty for a full release.'
        required: false
        default: ''
      publish-psgallery:
        description: 'Publish the resulting module to PowerShell Gallery?'
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build Module
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.compute-tag.outputs.release-tag }}
      prerelease: ${{ steps.compute-tag.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release tag
        id: compute-tag
        run: |  # shell
          set -e
          # read version from csproj
          version=$(grep -oP '(?<=<Version>)[^<]+' src/PoSh.FluidTemplateEngine.csproj)
          if [ -z "$version" ]; then
            echo "Could not determine version from csproj" >&2
            exit 1
          fi
          if [ "${{ github.event.inputs.prerelease-name }}" != "" ]; then
            tag="${version}-${{ github.event.inputs.prerelease-name }}"
            prerelease=true
          else
            tag="$version"
            prerelease=false
            # full releases only from main branch
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "Full release can only be run on the main branch (current ref: $GITHUB_REF)" >&2
              exit 1
            fi
          fi
          echo "Computed release tag: $tag"
          echo "release-tag=$tag" >> $GITHUB_OUTPUT
          echo "prerelease=$prerelease" >> $GITHUB_OUTPUT
          # create and push the tag if it doesn't already exist
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists, skipping creation."
          else
            git tag "$tag"
            git push origin "$tag"
          fi

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/PoSh.FluidTemplateEngine.csproj

      - name: Build & Package
        shell: pwsh
        run: ./run.ps1 -Mode Package -BuildConfig Release

      - name: Run full test suite
        shell: pwsh
        run: |
          # execute the Pester tests against the freshly built package
          ./run.ps1 -Mode Tests

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-package
          path: out/publish/PoSh.FluidTemplateEngine/

      - name: Publish to PSGallery
        if: ${{ github.event.inputs.publish-psgallery == 'true' }}
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |  # powershell
          if (-not $env:NUGET_API_KEY) {
            throw 'PSGALLERY_API_KEY secret is not set'
          }
          Publish-Module -Path './out/publish/PoSh.FluidTemplateEngine' -NuGetApiKey $env:NUGET_API_KEY -Verbose

      - name: Create release archive
        run: |  # shell
          cd out/publish/PoSh.FluidTemplateEngine
          zip -r ../../PoSh.FluidTemplateEngine-${{ steps.compute-tag.outputs.release-tag }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.compute-tag.outputs.release-tag }}
          generate_release_notes: true
          files: PoSh.FluidTemplateEngine-${{ steps.compute-tag.outputs.release-tag }}.zip
          draft: false
          prerelease: ${{ steps.compute-tag.outputs.prerelease }}
